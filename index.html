<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2a5ba8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>HygieneTech Site Survey</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="assets/logo.png" alt="HygieneTech" />
        <div class="brand-copy">
          <h1>Site Survey</h1>
          <p>Housekeeping scoping checklist</p>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="stepLabel">Step 1</span>
          <strong>HygieneTech</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="card" id="stepRoot" aria-live="polite"></section>
      <div id="statusBanner" class="status-banner" role="status"></div>
    </main>

    <nav class="nav-bar" aria-label="Form navigation">
      <div class="nav-inner">
        <button type="button" class="btn btn-secondary" id="btnPrev">Back</button>
        <button type="button" class="btn btn-primary" id="btnNext">Next</button>
      </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/form-schema.js"></script>
    <script src="js/pdf.js"></script>
    <script src="js/email.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
